name: Checkout validation

on:
  pull_request:
    paths:
      - "app/kassa/**"
      - "lib/checkout*.ts"
      - "tests/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "package*.json"
      - ".github/workflows/checkout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
